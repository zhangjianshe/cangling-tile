name: ci

on:
  push:
    tags: ["v*"]

env:
  CARGO_TERM_COLOR: always
  HARBOR_IMAGE: harbor.cangling.cn:22002/cangling/cangling-tile

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: compile (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64
            os: ubuntu-latest
            docker_arch: amd64
          - name: aarch64
            os: ubuntu-24.04-arm
            docker_arch: arm64
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.name }}-release
          cache-on-failure: true
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Compile cangling-tile
        run: |
          GIT_HASH="${GITHUB_SHA:0:7}" \
          BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          cargo build --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@v5
        with:
          name: cangling-tile-${{ matrix.docker_arch }}
          path: target/release/cangling-tile
          if-no-files-found: error
          retention-days: 3

  docker:
    concurrency:
      group: drive-base-images-cangling-tile
      cancel-in-progress: false
    name: docker image
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v5
      - name: Read crate version
        id: meta
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          test "${GITHUB_REF_NAME}" = "v${version}" || {
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${version}" >&2
            exit 1
          }
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Layout binaries for TARGETARCH
        run: |
          mkdir -p binaries/amd64 binaries/arm64
          cp artifacts/cangling-tile-amd64/cangling-tile binaries/amd64/
          cp artifacts/cangling-tile-arm64/cangling-tile binaries/arm64/
          chmod +x binaries/amd64/cangling-tile binaries/arm64/cangling-tile
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: harbor.cangling.cn:22002
          username: ${{ secrets.HARBOR_USERNAME }}
          password: ${{ secrets.HARBOR_PASSWORD }}
      - uses: docker/build-push-action@v7
        id: publish_image
        with:
          context: .
          file: Dockerfile.ci
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.HARBOR_IMAGE }}:latest
            ${{ env.HARBOR_IMAGE }}:${{ steps.meta.outputs.version }}
            ${{ env.HARBOR_IMAGE }}:${{ github.sha }}
          cache-from: type=gha,scope=cangling-tile-image
          cache-to: type=gha,mode=max,scope=cangling-tile-image
      - name: Set up Python for release webhook
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test webhook client
        run: python scripts/test-release-via-webhook.py
      - name: Publish images through the internal webhook
        env:
          RELEASE_WEBHOOK_URL: ${{ vars.RELEASE_WEBHOOK_URL }}
          RELEASE_WEBHOOK_SECRET: ${{ secrets.RELEASE_WEBHOOK_SECRET }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_DIGEST: ${{ steps.publish_image.outputs.digest }}
        run: python scripts/release-via-webhook.py --project cangling-tile --version "$RELEASE_VERSION" --digest "$IMAGE_DIGEST"
